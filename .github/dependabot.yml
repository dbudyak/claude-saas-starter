version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/backend
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /services/infra/docker
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
